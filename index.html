<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Techpep Labs — Verificação</title>
<style>
body{margin:0;background:#090b10;color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{width:min(680px,90vw);padding:42px 28px;border:1px solid #2d3748;border-radius:24px;background:linear-gradient(145deg,#111827,#07090d);box-shadow:0 20px 70px #0008;text-align:center}
.logo{max-width:460px;width:80%;border-radius:12px;margin-bottom:28px}
.badge{display:inline-block;border:1px solid #32d5ff;color:#7ee8ff;border-radius:999px;padding:8px 14px;font-size:13px;letter-spacing:2px}
h1{font-size:clamp(28px,6vw,48px);margin:22px 0 10px}
p{color:#b9c2d0;font-size:18px;line-height:1.6;margin:0}
.footer{margin-top:30px;font-size:12px;color:#657184}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="techpep_labs_logo_reference.png" alt="Techpep Labs">
<div class="badge">VERIFICAÇÃO</div>
<h1>Produto Original de alta Pureza</h1>
<p>Techpep Labs</p>
<div class="footer">Página demonstrativa de verificação de marca.</div>
</main>
</body>
</html>
